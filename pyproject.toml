[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "scarf-py"
version = "1.0.0"
description = "Python (nanobind-ed) porting of the SCARF (Set of Center Active Receptive Fields) velocity invariant events representation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.scikit-build]
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

[tool.cibuildwheel]
build = "cp312-*"
# Necessary to see build output from the actual compilation
build-verbosity = 1

# Optional: run pytest to ensure that the package was correctly built
# test-command = "pytest {project}/tests"
# test-requires = "pytest"

# Needed for full C++17 support on macOS
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"