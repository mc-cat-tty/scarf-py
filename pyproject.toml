[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "scarf"
version = "1.0.0"
description = "Python (nanobind-ed) porting of the SCARF (Set of Center Active Receptive Fields) velocity invariant events representation."
readme = "README.md"
requires-python = ">=3.12"

[tool.scikit-build]
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"